name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish-pypi:
        description: Publish the built distributions to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify wheel metadata and contents
        run: uv run --with twine twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: >-
      ${{ vars.PYPI_PUBLISH_ENABLED == 'true' &&
          (github.event_name == 'push' || inputs.publish-pypi) }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/excel-lsp/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@v1.14.1
